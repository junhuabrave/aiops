name: Lab contracts and smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - name: Enable Ubuntu's scoped Bubblewrap profile
        # Host setup must precede container startup. Do not disable Ubuntu's
        # userns restriction globally or give workers the host network.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apparmor-profiles
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
      - name: Debian contracts, race checks and credential-free smoke
        # Disposable hosted runner only. The outer container permits inner
        # namespace setup; systempaths lets bwrap write its new userns limit.
        # These options also expose kernel paths to the outer job container:
        # never reuse them on shared runners or as a production sandbox.
        # No --privileged, Docker socket, production secrets or production access.
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
            --mount "type=bind,src=$(command -v uv),dst=/usr/local/bin/uv,readonly" \
            --workdir /workspace debian:13 bash -euc '
              bash lab/install.sh
              make -C lab build verify verify-ai
              uv run --locked --project lab/ai python lab/tests/smoke.py --ai-replay
            '
      - name: Restore report ownership for artifact collection
        if: always()
        run: |
          if [ -d lab/.run ]; then
            sudo chown -R "$(id -u):$(id -g)" lab/.run
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-functional-result
          path: |
            lab/.run/current/verification.json
            lab/.run/current/replay-*/*.json
          if-no-files-found: ignore
