name: Lab contracts and smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    container:
      image: debian:13
      # Disposable hosted runner only: permit the inner sandbox to create its
      # namespaces. Workers still install their own seccomp policy and drop caps.
      # No --privileged, extra host mounts, production secrets or production access.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native lab dependencies
        run: bash lab/install.sh
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
      - name: Contract, race and alert-rule checks
        run: make -C lab build verify verify-ai
      - name: Credential-free functional smoke (no models)
        run: uv run --locked --project lab/ai python lab/tests/smoke.py --ai-replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-functional-result
          path: |
            lab/.run/current/verification.json
            lab/.run/current/replay-*/*.json
          if-no-files-found: ignore
